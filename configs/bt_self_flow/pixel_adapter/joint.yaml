base: ../precision_v2/c_joint.yaml
decoder:
  method: sana_conditioned_pixel_adapter_v1
  pixel_adapter:
    depth: 2
    pixel_dim: 16
    patch_size: 16
    context_dim: 256
    attention_dim: 256
    heads: 4
    use_quantization: true
    delta_ref: 1.0
    checkpoint_blocks: true
    seed: 903
train:
  output: ${PIT_RUN_ROOT:-checkpoints/c_pixel_adapter_v1}/content_quantization
  batch_size: 8
  accumulation_steps: 1
  effective_batch: 8
