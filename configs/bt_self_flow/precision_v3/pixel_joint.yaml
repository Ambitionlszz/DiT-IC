# New C v3 + PiT D. Initialize from the completed new-C warmup EMA.
base: c_joint.yaml
decoder:
  method: precision_consistent_pixel_adapter_v1
  pixel_adapter:
    depth: 2
    pixel_dim: 16
    patch_size: 16
    context_dim: 256
    attention_dim: 256
    heads: 4
    use_quantization: true
    delta_ref: 1.0
    checkpoint_blocks: true
    seed: 903
execution:
  saved_tensors: device
train:
  output: ${NEWC_PIT_RUN_ROOT:-checkpoints/newc_pit_v1}/joint
  log_every: 10
  save_every: 2000
