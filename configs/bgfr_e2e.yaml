data:
  data_path:
    - /data2/luosheng/data/Datasets/DIV2K_train_HR_clean
    - /data2/luosheng/data/Datasets/Flickr2K/Flickr2K_png
    - /data2/luosheng/data/Datasets/LSDIR
    - /data2/luosheng/data/Datasets/clic_professional_train_2020/clic_professional_train_2020_png
  valid_path:
    - /data2/luosheng/data/Datasets/Kodak
  im_exts: [JPEG, png, jpg, jpeg, PNG]
  num_workers: 4
  path_size: [256, 256]

model:
  model_type: Codec
  params:
    decode_mode: sana
    use_text_condition: true
    text_encoder_path: /data2/luosheng/hf_models/hub/SANA_600M_1024px_diffusers/text_encoder
    dit_path: SANA
    codec_path: /data2/luosheng/code/DiT-IC/checkpoints/variable_rate_lic_v5_main/checkpoints/phase_a_complete.pt
    use_ema: true
    use_merge: false
    training: true
    freeze_codec: false
    strict_stage_loading: true
    allow_phase_a_handoff: true
    train_text_projection: true
    decoder_relay_params:
      # Launcher overrides mode with none / decoder_self / bitstream.
      mode: bitstream
      source_channels: 320
      hidden_channels: 64
      stage_block_indices: [3, 2, 1]
    DiT_params:
      DiT: true
      DiT_lora: true
      lora_rank_DiT: 128
      lora_alpha_DiT: 128
      channel_in: 32
    vae_params:
      vae_lora: true
      train_vae_lora: true
      decoder_lora_only: true
      lora_rank_vae: 32
      lora_alpha_vae: 32
    codec_param:
      ch_emd: 32
      channel: 320
      channel_out: 32
      num_slices: 5
      max_support_slices: 5
      kernel_size: 3
      drop_path_rate: 0.1
      depths: [2, 2, 2, 2, 2]
      num_heads: [16, 16, 16, 16, 16]
      upsample_mode: pixelshuffle
      variable_rate: true
      num_quality_levels: 6
    loss_params:
      pp_style: true
      pixelloss_weight: 1.0
      perceptual_weight: 1.0
      rate_weight: 1.0
      disc_start: 1000000
      disc_weight: 0.0

quality_control:
  enabled: true
  num_levels: 6
  sampling: uniform_step_shared
  semantic_order: low_to_high_bpp
  rate_weights: [16.0, 8.0, 4.0, 2.0, 1.0, 0.5]

train:
  output_dir: checkpoints
  exp_name: bgfr_b2_bitstream_e2e
  per_gpu_batch_size: 4
  accumulation_steps: 2
  accumulate_disc: false
  resume: false
  log_every: 100
  eval_every: 2000
  ckpt_every: 25000
  max_steps: 100000
  global_seed: 903
  # Runtime replaces this with the sampled quality's rate weight.
  rate_weight: 1.0

optimizer:
  lr: 0.0001
  aux_lr: 0.001
  entropy_lr: 0.001
  beta2: 0.999
  beta_vae: [0.9, 0.999]
  step_lr: [60000, 85000, 95000]
  max_grad_norm: 4.0
