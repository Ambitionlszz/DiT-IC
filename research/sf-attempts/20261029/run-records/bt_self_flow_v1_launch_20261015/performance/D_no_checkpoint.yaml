data:
  train:
  - /data2/ls/data/DIV2K_train_HR_clean
  - /data2/ls/data/Flickr2K/Flickr2K_png
  - /data2/ls/data/LSDIR
  - /data2/ls/data/clic_professional_train_2020/clic_professional_train_2020_png
  valid:
  - /data2/ls/data/DIV2K_valid_HR
  crop: 512
  workers: 0
  valid_limit: 1
model:
  sana_path: /data2/ls/checkpoints/SANA
  text_path: /data2/ls/checkpoints/ditic-50k-warmups/pretrained/fixed_text_embed_gemma.pt
  backend: D
  dit_rank: 128
  vae_rank: 32
  checkpoint_blocks: false
  codec:
    ch_emd: 32
    channel: 320
    channel_out: 32
    delta_coarse: 4.0
    delta_fine: 0.5
    kappa: 0.6931471805599453
optimizer:
  codec_lr: 0.0001
  joint_codec_lr: 5.0e-05
  backend_lr: 0.0001
  vae_lr: 1.0e-05
  aux_lr: 0.001
  max_grad_norm: 4.0
  warmup: 2
image_loss:
  mse_weight: 2.0
  lpips_weight: 1.0
  dists_weight: 0.5
self_flow:
  enabled: false
  mixed_sampling: false
  high_fraction: 0.25
  student_layer: 8
  teacher_layer: 20
  warmup: 1000
  ramp: 2000
  calibrate_every: 500
  gradient_target: 0.05
  gradient_cap: 0.1
train:
  phase: joint
  steps: 14
  output: /data2/ls/checkpoints/bt_self_flow_v1_launch_20261015/performance/D_no_checkpoint
  batch_size: 2
  effective_batch: 8
  accumulation_steps: 4
  seed: 903
  eval_every: 14
  save_every: 14
  log_every: 1
  packet_samples: 1
  data_scale_samples: 2
  calibration_samples: 4
  router_uniform_steps: 2
  router_ramp_steps: 3
