# Frozen codec MeanFlow 5A warm-start experiment — AdaLN conditioning ablation
# Init from pure_sana_gemma_lrd0p4 130k checkpoint
# Conditioning: adaln (reference-size t/h embedders → SANA AdaLN-Single path)
data:
  data_path:
    - /data2/luosheng/data/Datasets/DIV2K_train_HR_clean
    - /data2/luosheng/data/Datasets/Flickr2K/Flickr2K_png
    - /data2/luosheng/data/Datasets/LSDIR
    - /data2/luosheng/data/Datasets/clic_professional_train_2020/clic_professional_train_2020_png
  valid_path:
    - /data2/luosheng/data/Datasets/Kodak
  im_exts: ['JPEG', 'png', 'jpg', 'jpeg', 'PNG']
  num_workers: 8
  path_size: [256, 256]

model:
  model_type: Codec
  use_checkpoint: false
  params:
    use_aux_encoder: False
    use_aux_decoder: False
    use_variance_guide: False
    use_self_dist: False
    use_text_condition: True
    text_encoder_path: "/data2/luosheng/hf_models/hub/SANA_600M_1024px_diffusers/text_encoder"
    time: 999
    codec_mode: 'self_dist'
    DiT_mode: 'scale'
    dit_path: "SANA"
    elic_path: "/data2/luosheng/hf_models/hub/elic_official.pth"
    # Init from Pure SANA checkpoint, freeze codec for fixed-bitstream comparison
    codec_path: "/data2/luosheng/code/DiT-IC/checkpoints/pure_sana_gemma_lrd0p4_bs8_200k_noauxed_noauxe_noauxd_novarguide_noselfdist_textcond/checkpoints/0130000.pt"
    freeze_codec: True
    use_ema: True
    use_merge: False
    training: True
    DiT_params:
      DiT: True
      DiT_lora: True
      lora_rank_DiT: 128
      lora_alpha_DiT: 128
      channel_in: 32
    vae_params:
      vae_lora: True
      lora_rank_vae: 64
      lora_alpha_vae: 64
    codec_param:
      ch_emd: 32
      channel: 320
      channel_out: 32
      num_slices: 5
      max_support_slices: 5
      kernel_size: 3
      drop_path_rate: 0.1
      depths: [2, 2, 2, 2, 2]
      num_heads: [16, 16, 16, 16, 16]
      upsample_mode: 'pixelshuffle'
    loss_params:
      pp_style: true
      pixelloss_weight: 1.0
      perceptual_weight: 1.0
      kl_weight: 0.1
      disc_start: 1000000
      disc_weight: 0.
      use_vf: ~
      latent: False
      reverse_proj: True
      vf_weight: 0.1
      adaptive_vf: True
      distmat_margin: 0.25
      cos_margin: 0.5
    meanflow_params:
      enabled: true
      mode: meanflow
      conditioning_mode: adaln
      adaln_embedding_dim: 1152
      frequency_embedding_size: 256
      weight: 0.05
      equal_time_ratio: 0.5
      time_distribution: logit_normal
      logit_mean: -0.4
      logit_std: 1.0
      norm_p: 1.0
      norm_eps: 0.01

train:
  output_dir: 'checkpoints'
  exp_name: 'frozen_recon_5a_adaln_lrd0p4_130kinit'
  global_batch_size: 8
  accumulation_steps: 1
  accumulate_disc: false
  resume: false
  log_every: 100
  eval_every: 2000
  ckpt_every: 10000
  max_steps: 10000
  global_seed: 903
  lrd: 0.4
optimizer:
  lr: 0.00005
  aux_lr: 0.001
  beta2: 0.999
  beta_vae: [0.9, 0.999]
  step_lr: [100000, 160000, 180000]
  max_grad_norm: 4.0
